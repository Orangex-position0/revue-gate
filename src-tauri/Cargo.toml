[package]
name = "revue-gate"
version = "0.1.0"
description = "revue-gate — 本地 LLM API 网关桌面应用"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "revue_gate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Clippy 基线：all 组提升为显式 warn（配合 hook 的 -D warnings 生效），
# 禁止 TODO/未实现占位提交（rust-workflow 单 crate 默认，见 rules/rust/rust-workflow-standards.md）
[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"

