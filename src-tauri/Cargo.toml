[package]
name = "revue-gate"
version = "0.1.0"
description = "revue-gate — 本地 LLM API 网关桌面应用"
authors = ["you"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "revue_gate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Serialization/parsing round-trip invariants (mandatory-tier PBT, see rules/property-based-testing.md)
proptest = "1"

# Clippy baseline: all group promoted to explicit warn (takes effect with the hook's -D warnings),
# blocks TODO/unimplemented placeholder commits (rust-workflow single-crate default, see rules/rust/rust-workflow-standards.md)
[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
