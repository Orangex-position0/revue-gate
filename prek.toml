# revue-gate managed hooks: one prek setup shared by Rust (src-tauri) and the frontend (React+TS)
# Install: prek install (run from repo root); pre-commit filters by changed files, pre-push is a full gate
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

[[repos]]
repo = "local"

# ---- Rust (crate lives in src-tauri/, targeted via --manifest-path, not dependent on the hook working dir) ----
# Note: no cargo-todo hook — it does not support --manifest-path and prek has no per-hook cwd, so it cannot target the nested crate;
# TODO/unimplemented placeholders are already covered by todo = "deny" in Cargo.toml [lints.clippy]

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check"
files = "(\\.rs$|(^|/)Cargo\\.(toml|lock)$)"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "check"
name = "cargo check"
language = "system"
entry = "cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features"
files = "(\\.rs$|(^|/)Cargo\\.(toml|lock)$)"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "test"
name = "cargo nextest"
language = "system"
entry = "cargo nextest run --locked --manifest-path src-tauri/Cargo.toml --no-tests=pass"
pass_filenames = false
always_run = true
stages = ["pre-push"]

# ---- Frontend (React + TS, repo root) ----

[[repos.hooks]]
id = "tsc"
name = "tsc --noEmit"
language = "system"
entry = "pnpm exec tsc"
files = "(\\.[cm]?tsx?$|(^|/)package\\.json$|(^|/)tsconfig.*\\.json$)"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "frontend-build"
name = "pnpm build"
language = "system"
entry = "pnpm build"
pass_filenames = false
always_run = true
stages = ["pre-push"]

# ---- Commit metadata ----

[[repos.hooks]]
id = "commit-msg"
name = "Conventional Commit message"
language = "system"
entry = "node scripts/check-commit-msg.mjs"
stages = ["commit-msg"]
